name: ca199_toolbox
description: CA199 健康指标监测工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.3.beta

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理 & 路由 ──
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0

  # ── 图表 ──
  fl_chart: ^0.70.0

  # ── 文件导入 ──
  file_picker: ^9.0.0
  csv: ^6.0.0

  # ── 本地存储 ──
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ── 图片保存 ──
  screenshot: ^3.0.0
  gal: ^2.3.0

  # ── UI 增强 ──
  flutter_neumorphic: ^3.0.0
  shimmer: ^3.0.0
  dropdown_button2: ^2.3.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
